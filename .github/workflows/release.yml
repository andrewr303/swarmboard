name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to v<package.json version>)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Resolve and validate release tag
        id: meta
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "Tag ${TAG} does not match package.json version (${EXPECTED_TAG})" >&2
              exit 1
            fi
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="$EXPECTED_TAG"
            fi
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (unit & integration)
        run: >-
          pnpm exec vitest run --maxWorkers=2
          --exclude 'tests/host/wake-bridge.test.ts'
          --exclude 'tests/client/transport-inproc.test.ts'
          --exclude 'tests/conformance/waits.test.ts'
          --exclude 'tests/host/proc/**'
          --exclude 'tests/core/tasks/proc/**'
          --exclude 'tests/client/proc/**'
          --exclude 'tests/conformance/proc/**'

      - name: Test (multi-process & timing-sensitive)
        run: >-
          pnpm exec vitest run --fileParallelism=false --maxWorkers=1
          tests/host/wake-bridge.test.ts
          tests/client/transport-inproc.test.ts
          tests/conformance/waits.test.ts
          tests/host/proc
          tests/core/tasks/proc
          tests/client/proc
          tests/conformance/proc

      - name: Build release archives
        run: pnpm run pack:release --skip-build

      - name: Smoke-test standalone install.sh & uninstall in clean environment
        run: |
          VER="${{ steps.meta.outputs.version }}"
          SMOKE_HOME="$(mktemp -d /tmp/swarmboard-rel-home.XXXXXX)"
          SMOKE_APP="$(mktemp -d /tmp/swarmboard-rel-app.XXXXXX)/app"
          SMOKE_BIN="$(mktemp -d /tmp/swarmboard-rel-bin.XXXXXX)"
          sh ./install.sh --tarball "release/swarmboard-v${VER}.tar.gz" --home "$SMOKE_HOME" --dir "$SMOKE_APP" --bin-dir "$SMOKE_BIN"
          "$SMOKE_BIN/swarmboard" --version
          env -u XDG_CONFIG_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME -u XDG_RUNTIME_DIR HOME="$SMOKE_HOME" "$SMOKE_BIN/swarmboard" doctor --json
          env -u XDG_CONFIG_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME -u XDG_RUNTIME_DIR HOME="$SMOKE_HOME" "$SMOKE_BIN/swarmboard" post general "release smoke ok" --as ci-smoke --json
          sh ./install.sh --uninstall --purge-data --home "$SMOKE_HOME" --dir "$SMOKE_APP" --bin-dir "$SMOKE_BIN"
          rm -rf "$SMOKE_HOME" "$(dirname "$SMOKE_APP")" "$SMOKE_BIN"

      - name: Smoke-test npm package tarball install in isolated prefix
        run: |
          VER="${{ steps.meta.outputs.version }}"
          NPM_PREFIX="$(mktemp -d /tmp/swarmboard-npm-prefix.XXXXXX)"
          env -u NPM_CONFIG_USERCONFIG -u NODE_AUTH_TOKEN npm install -g --prefix "$NPM_PREFIX" "${PWD}/release/swarmboard-${VER}.tgz"
          "$NPM_PREFIX/bin/swarmboard" --version
          "$NPM_PREFIX/bin/swarmboard-mcp" --version
          "$NPM_PREFIX/bin/swarmboard-daemon" --version
          rm -rf "$NPM_PREFIX"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.version }}"
          ASSETS=(
            "release/swarmboard-v${VER}.tar.gz"
            "release/swarmboard-${VER}.tgz"
            "release/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Swarmboard ${TAG}" \
              --generate-notes
          fi

      - name: Publish to npm (when NPM_TOKEN is configured)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "${PWD}/release/swarmboard-${{ steps.meta.outputs.version }}.tgz" --provenance --access public
          else
            echo "NPM_TOKEN secret not configured; skipping npm publish."
          fi
